name: libEnsemble-simple-CI

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize

concurrency:
  group: basic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HYDRA_LAUNCHER: fork
  MPIR_CVAR_CH4_NETMOD: ofi
  TERM: xterm-256color
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  static:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312
      - name: Run static analysis
        run: pixi run -e py312 flake8 libensemble && pixi run -e py312 mypy

  unit:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py312, py313, py314]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: ${{ matrix.environment }}
      - name: Run unit tests
        run: pixi run -e ${{ matrix.environment }} ./libensemble/tests/run_tests.py -u --no-coverage --durations 20

  core:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comms: [m, l]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312
      - name: Install MINQ
        run: pixi run -e py312 ./install/install_minq.sh
      - name: Run core tests
        run: >-
          pixi run -e py312 ./libensemble/tests/run_tests.py -r -${{ matrix.comms }}
          -A "-W error" --no-coverage --fail-fast --durations 25
          --timings-json timings-${{ matrix.comms }}.json
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.comms }}-timings
          path: timings-${{ matrix.comms }}.json
          if-no-files-found: ignore

  tcp-smoke:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312
      - name: Run TCP smoke tests
        run: >-
          pixi run -e py312 ./libensemble/tests/run_tests.py -r -t
          --no-coverage --fail-fast --durations 20 --timings-json timings-tcp.json
          --match test_1d_sampling.py
          --match test_persistent_uniform_sampling.py
          --match test_worker_exceptions.py
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-smoke-timings
          path: timings-tcp.json
          if-no-files-found: ignore

  macos-smoke:
    if: "! github.event.pull_request.draft"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312
      - name: Run local smoke tests
        run: >-
          pixi run -e py312 ./libensemble/tests/run_tests.py -r -l
          --no-coverage --fail-fast --durations 20
          --match test_1d_super_simple.py
          --match test_persistent_uniform_sampling_async.py
          --match test_executor_simple.py
      - name: Run MPI smoke tests
        run: >-
          pixi run -e py312 ./libensemble/tests/run_tests.py -r -m
          --no-coverage --fail-fast --durations 20
          --match test_1d_super_simple.py
          --match test_persistent_uniform_sampling_async.py

  coverage:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312
      - name: Install MINQ
        run: pixi run -e py312 ./install/install_minq.sh
      - name: Run canonical coverage suite
        run: pixi run -e py312 ./libensemble/tests/run_tests.py -l --coverage --fail-fast --durations 25
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
