name: libEnsemble-complete-CI

on:
  workflow_dispatch:
    inputs:
      run_exhaustive:
        description: Run the legacy Python, OS, and transport matrix
        required: false
        default: false
        type: boolean

concurrency:
  group: complete-${{ github.ref }}
  cancel-in-progress: true

env:
  HYDRA_LAUNCHER: fork
  MPIR_CVAR_CH4_NETMOD: ofi
  TERM: xterm-256color
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comms: [m, l]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Install MINQ
        run: pixi run -e py312e install/install_minq.sh
      - name: Run core tests
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -e -${{ matrix.comms }}
          --tier core --no-coverage --fail-fast --durations 25
          --timings-json timings-core-${{ matrix.comms }}.json
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complete-core-${{ matrix.comms }}-timings
          path: timings-core-${{ matrix.comms }}.json
          if-no-files-found: ignore

  coverage:
    if: "! github.event.pull_request.draft"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Install MINQ
        run: pixi run -e py312e ./install/install_minq.sh
      - name: Install gpCAM
        run: pixi run -e py312e pip install gpcam==8.1.13
      - name: Run coverage suite (shard 0 - unit + regression slice)
        if: matrix.shard == 0
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -l -m -e
          --coverage --fail-fast --durations 25
          --shard 0/4 --timings-json timings-coverage-0.json
      - name: Run coverage suite (shards 1-3 - regression slice only)
        if: matrix.shard != 0
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -l -m -e
          --coverage --fail-fast --durations 25
          --shard ${{ matrix.shard }}/4 --timings-json timings-coverage-${{ matrix.shard }}.json
      - name: Stage coverage files
        if: always()
        run: |
          mkdir -p cov_staging
          find libensemble/tests -type f \( -name ".cov_*" -o -name ".coverage" -o -name ".coverage.*" \) ! -name ".cov_merge_out*" ! -name ".coveragerc" -exec cp --parents {} cov_staging/ \; 2>/dev/null || echo "no .cov files in libensemble/tests"
          echo "Staged files:"; find cov_staging -type f | head -n 50; echo "---"; du -sh cov_staging 2>/dev/null || true
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: cov_staging/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-timings-${{ matrix.shard }}
          path: timings-coverage-${{ matrix.shard }}.json
          if-no-files-found: ignore

  coverage-combine:
    if: always() && !cancelled() && needs.coverage.result != 'skipped'
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
          path: _coverage_data
          merge-multiple: true
      - name: Combine coverage reports
        run: |
          echo "Downloaded artifacts:"; find _coverage_data -type f | head -n 80
          echo "--- restoring to libensemble/tests ---"
          mkdir -p libensemble/tests
          if [ -d _coverage_data/libensemble ]; then
            if command -v rsync >/dev/null 2>&1; then
              rsync -a _coverage_data/libensemble/ libensemble/
            else
              cp -a _coverage_data/libensemble/tests/. libensemble/tests/ 2>/dev/null || true
              cp -rn _coverage_data/libensemble/* libensemble/ 2>/dev/null || true
            fi
          else
            find _coverage_data -type f \( -name ".cov_*" -o -name ".coverage" -o -name ".coverage.*" \) ! -name ".cov_merge_out*" ! -name ".coveragerc" -exec cp --parents {} . \; 2>/dev/null || true
          fi
          echo "Files in libensemble/tests:"; ls -lh libensemble/tests/.cov_* 2>&1 | head -n 80; find libensemble/tests -type f \( -name ".cov_*" -o -name ".coverage" -o -name ".coverage.*" \) ! -name ".cov_merge_out*" ! -name ".coveragerc" | head -n 80
          echo "Top-level .coveragerc:"; cat libensemble/tests/.coveragerc | head -n 10; ls -lh libensemble/tests/.coveragerc
          (cd libensemble/tests && COV_FILES=$(find . -type f \( -name ".cov_*" -o -name ".coverage" -o -name ".coverage.*" \) ! -name ".cov_merge_out*" ! -name ".coveragerc" | tr '\n' ' ') && if [ -z "$COV_FILES" ]; then echo "No coverage files found to combine"; find . -type f | head -n 50; exit 1; fi && echo "Combining coverage files:" && echo "$COV_FILES" | tr ' ' '\n' | head -n 50 && pixi run -e py312e coverage combine $COV_FILES)
          ls -lh libensemble/tests/.cov_merge_out* libensemble/tests/.coverage 2>&1 | head -n 20
          (cd libensemble/tests && pixi run -e py312e coverage xml -o coverage.xml)
          (cd libensemble/tests && pixi run -e py312e coverage report --skip-covered | tail -n 80)
          echo "coverage.xml size:"; ls -lh libensemble/tests/coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: libensemble/tests/coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload final timing artifacts
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-timings-*
          path: _timings
          merge-multiple: true
      - name: Merge and display timings
        if: always()
        run: |
          find _timings -name "*.json" -exec cat {} \; 2>/dev/null | head -c 2000 || echo "no timings"

  external:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Install external test dependencies
        run: |
          pixi run -e py312e install/install_minq.sh
          pixi run -e py312e pip install gpcam==8.1.13
      - name: Run external integration shard
        run: >-
          timeout --signal=TERM --kill-after=30s 8m
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -e -l
          --tier external --no-coverage --fail-fast --durations 25
          --exclude-match test_proxystore_integration.py
          --shard ${{ matrix.shard }}/2
          --timings-json timings-external-${{ matrix.shard }}.json
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-${{ matrix.shard }}-timings
          path: timings-external-${{ matrix.shard }}.json
          if-no-files-found: ignore

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Install slow-test dependencies
        run: pixi run -e py312e pip install gpcam==8.1.13
      - name: Run slow integration tests
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -e -l
          --tier slow --no-coverage --fail-fast --durations 25
          --timings-json timings-slow.json
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-timings
          path: timings-slow.json
          if-no-files-found: ignore

  external-mpi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Run representative external MPI tests
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -e -m
          --no-coverage --fail-fast --largest-nprocs-only --durations 20
          --match test_mfkg_branin.py
          --match test_persistent_aposmm_nlopt.py
          --match test_optimas_grid_sample.py

  proxystore:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Run ProxyStore integration
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -e -l
          --feature redis --no-coverage --fail-fast --durations 10

  openmpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: openmpi
      - name: Verify Open MPI environment
        run: pixi run -e openmpi mpiexec --version
      - name: Run Open MPI compatibility tests
        run: >-
          pixi run -e openmpi ./libensemble/tests/run_tests.py -r -m
          -a=--oversubscribe --no-coverage --fail-fast --durations 20
          --match test_1d_super_simple.py
          --match test_mpi_runners.py
          --match test_persistent_uniform_sampling_async.py

  macos-platform:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: py312e
      - name: Run macOS platform tests
        run: >-
          pixi run -e py312e ./libensemble/tests/run_tests.py -r -l
          --no-coverage --fail-fast --durations 20
          --match test_1d_super_simple.py
          --match test_executor_simple.py
          --match test_persistent_uniform_sampling_async.py
          --match test_sim_dirs_per_calc.py

  exhaustive:
    if: ${{ inputs.run_exhaustive == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: [py312e, py313e, py314e]
        comms: [m, l]
        include:
          - os: macos-latest
            environment: py312e
            comms: m
          - os: macos-latest
            environment: py312e
            comms: l
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          environments: ${{ matrix.environment }}
      - name: Install optional dependencies
        if: matrix.environment == 'py312e'
        run: pixi run -e py312e pip install gpcam==8.1.13
      - name: Run exhaustive suite
        run: >-
          pixi run -e ${{ matrix.environment }} ./libensemble/tests/run_tests.py
          -e -${{ matrix.comms }} --no-coverage --durations 25
